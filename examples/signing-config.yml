# Noia Aegis - Complete Configuration File
# Use this file with: aegis protect signing-config.yml

# ============================================================
# APK Configuration
# ============================================================
apk:
  input: "./apks/app-release.apk" # Path to input APK (required)
  output: "app-protected.apk" # Output APK name (optional, default: input-protected.apk)

# ============================================================
# Signing Configuration
# ============================================================
signing:
 
  use_custom: true  # Use custom keystore (true) or debug keystore (false)
  
  # Keystore configuration (required if use_custom: true)
  keystore: "./apks/test-release.keystore"
  keystore_password: "password123"
  key_alias: "test-release"
  key_password: "password123"
  
  # Alternative: Use environment variables (recommended for security)
  # keystore_password: "env:AEGIS_KS_PASS"
  # key_password: "env:AEGIS_KEY_PASS"

# ============================================================
# Shield Configuration
# ============================================================
shields:
  root_detection: true # Detect rooted devices
  emulator_detection: true # Detect emulators
  debug_detection: true # Detect debuggers
  developer_options: true # Detect developer options/USB debugging
  integrity_check: false # Future: APK integrity verification

# ============================================================
# Behavior Configuration
# ============================================================
behavior:
  show_toast: true # Show toast message when threat detected
  exit_on_threat: true # Exit app when threat detected
  log_threats: false # Log threats to logcat (for debugging)

# ============================================================
# Custom Messages (Optional)
# ============================================================
messages:
  root_detected: "🔓 Root detected!"
  emulator_detected: "🖥️ Emulator detected!"
  debug_detected: "🐛 Debug mode detected!"
  developer_detected: "⚙️ Developer options enabled!"

# ============================================================
# Options
# ============================================================
options:
  verbose: false # Show verbose output
  keep_temp: false # Keep temporary files (for debugging)